[package]
name = "ops-traits-macros"
version = "0.1.0"
edition = "2024"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.*"
quote = "1.0.*"
syn = { version = "3.0.*", default-features = false, features = [
      "clone-impls",
      "extra-traits",
      "full",
      "parsing",
      "printing",
      "proc-macro",
]}

[lints.clippy]
pedantic = "warn"
