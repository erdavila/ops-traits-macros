[package]
name = "ops-traits-macros"
description = "Macros to simplify expressing std::ops trait bounds and types."
version = "0.1.0"
edition = "2024"
repository = "https://github.com/erdavila/ops-traits-macros"
readme = "README.md"
license-file = "LICENSE"
keywords = ["macros", "trait-bounds", "math", "ops", "operators"]
categories = ["mathematics", "rust-patterns"]
exclude = ["/justfile"]

[lib]
proc-macro = true

[dependencies]
indexmap = "2.14"
proc-macro2 = "1.0.*"
quote = "1.0.*"
syn = { version = "3.0.*", default-features = false, features = [
      "clone-impls",
      "extra-traits",
      "full",
      "parsing",
      "printing",
      "proc-macro",
]}

[lints.clippy]
pedantic = "warn"
